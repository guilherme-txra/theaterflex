<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheaterFlex</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <img src="../icons/icon32.png" alt="TheaterFlex Logo" class="logo-icon">
        <div>
          <h1 class="title">TheaterFlex</h1>
          <span class="subtitle">Modo Teatro Imersivo</span>
        </div>
      </div>
      <span class="version-badge">v1.1</span>
    </header>

    <!-- Main Toggle Card -->
    <div class="card toggle-card">
      <div class="card-info">
        <div class="status-indicator-wrapper">
          <span id="status-dot" class="status-dot active"></span>
          <span id="status-text" class="status-text">Ativado</span>
        </div>
        <p class="card-desc">Player expandido em 100% da janela</p>
      </div>
      <label class="switch" for="toggle-enabled">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <!-- Shortcut Card -->
    <div class="card shortcut-card">
      <div class="shortcut-header">
        <span class="shortcut-title">⌨️ Atalho de Teclado</span>
        <button id="btn-shortcuts" class="btn-link" title="Personalizar atalho no navegador">Configurar</button>
      </div>
      <div class="shortcut-display">
        <span class="shortcut-label">Alternar TheaterFlex:</span>
        <kbd id="shortcut-key" class="kbd-badge">Alt + Shift + T</kbd>
      </div>
    </div>

    <!-- Community & Open Source Links -->
    <div class="links-section">
      <a href="https://github.com/guilherme-txra/theaterflex.git" target="_blank" class="link-item" id="link-github">
        <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>Código Aberto no GitHub</span>
      </a>
      <a href="https://github.com/guilherme-txra/theaterflex.git" target="_blank" class="link-item" id="link-issues">
        <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span>Reportar Problema / Sugestão</span>
      </a>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>TheaterFlex • Licença MIT</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
